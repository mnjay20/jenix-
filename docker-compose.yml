version: '3.8'

services:
  # 1. Redis Cache & Job Context Store
  redis:
    image: redis:7-alpine
    container_name: jenix-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 2. Backend Node.js / Express / LangChain Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jenix-backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    env_file:
      - ./backend/.env
    depends_on:
      redis:
        condition: service_healthy

  # 3. Frontend React / Vite Web App
  frontend:
    build:
      context: ./page
      dockerfile: Dockerfile
    container_name: jenix-frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  redis_data:
